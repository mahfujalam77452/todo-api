        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadAllResponse'
          description: ''
  /api/notifications/unread-count:
    get:
      operationId: notifications_unread_count_retrieve
      description: Return the authenticated user's unread notification count.
      tags:
      - notifications
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
