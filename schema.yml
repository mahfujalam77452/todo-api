openapi: 3.0.3
info:
  title: TODO List REST API
  version: 1.0.0
  description: JWT-authenticated TODO API. Users can manage only their own todos;
    categories are globally readable and admin-managed.
paths:
  /api/health:
    get:
      operationId: health_retrieve
      description: Liveness probe. This endpoint does not require authentication.
      tags:
      - System
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/auth/register:
    post:
      operationId: auth_register_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/auth/me:
    get:
      operationId: auth_me_retrieve
      tags:
      - Authentication
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Current authenticated user.
  /api/auth/login:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/auth/token/refresh:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Exchange a refresh token for a new access token and a new refresh token
        (the old refresh token stops working).
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refresh'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      description: |-
        Blacklist a refresh token.

        Holding the refresh token is the proof, so no access token is needed: a
        user whose access token already expired can still log out. Access tokens
        already issued stay valid until they expire (15 minutes); that is how
        JWTs work.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/categories:
    post:
      operationId: categories_create
      description: 'Categories are global: every user can read them, only admins can
        change them.'
      tags:
      - Categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    get:
      operationId: categories_list
      description: List all globally available categories. The response is cached.
      tags:
      - Categories
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/categories/{id}:
    delete:
      operationId: categories_destroy
      description: 'Categories are global: every user can read them, only admins can
        change them.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,17}$
        required: true
      tags:
      - Categories
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    patch:
      operationId: categories_partial_update
      description: 'Categories are global: every user can read them, only admins can
        change them.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,17}$
        required: true
      tags:
      - Categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    get:
      operationId: categories_retrieve
      description: 'Categories are global: every user can read them, only admins can
        change them.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,17}$
        required: true
      tags:
      - Categories
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/todos:
    post:
      operationId: todos_create
      tags:
      - Todos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: ''
    get:
      operationId: todos_list
      description: List only the authenticated user's todos.
      parameters:
      - in: query
        name: assignment_status
        schema:
          type: string
          nullable: true
          enum:
          - accepted
          - pending
          - rejected
        description: |-
          pending, accepted, or rejected

          * `pending` - pending
          * `accepted` - accepted
          * `rejected` - rejected
      - in: query
        name: category
        schema:
          type: string
        description: 'Category id. Repeat for several: ?category=1&category=2'
      - in: query
        name: due_after
        schema:
          type: string
        description: due on or after this date and time, e.g. 2026-12-01T18:00:00+06:00
      - in: query
        name: due_before
        schema:
          type: string
        description: due on or before this date and time, e.g. 2026-12-01T18:00:00+06:00
      - in: query
        name: has_category
        schema:
          type: string
        description: 'true: only todos with a category, false: only todos without
          one'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: overdue
        schema:
          type: string
        description: 'true: not completed and past its due date; false: everything
          else'
      - in: query
        name: priority
        schema:
          type: string
        description: '1 (low), 2 (medium) or 3 (high). Repeat for several: ?priority=2&priority=3'
      - in: query
        name: relation
        schema:
          type: string
          enum:
          - assigned_by_me
          - assigned_to_me
        description: |-
          assigned_to_me or assigned_by_me

          * `assigned_to_me` - assigned_to_me
          * `assigned_by_me` - assigned_by_me
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - completed
          - in_progress
          - pending
        description: |-
          pending, in_progress, or completed

          * `pending` - pending
          * `in_progress` - in_progress
          * `completed` - completed
      - in: query
        name: team
        schema:
          type: string
        description: Team id.
      tags:
      - Todos
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTodoList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: ''
  /api/todos/{id}:
    delete:
      operationId: todos_destroy
      description: Hard-delete one of the authenticated user's todos.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,17}$
        required: true
      tags:
      - Todos
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    patch:
      operationId: todos_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,17}$
        required: true
      tags:
      - Todos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTodoRequest'
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    get:
      operationId: todos_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,17}$
        required: true
      tags:
      - Todos
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/todos/{id}/accept:
    post:
      operationId: todos_accept_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,17}$
        required: true
      tags:
      - todos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentResponseRequest'
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/todos/{id}/assign:
    post:
      operationId: todos_assign_create
      description: Assign a todo to a member of the assigner's team.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,17}$
        required: true
      tags:
      - todos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTodoRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/todos/{id}/reject:
    post:
      operationId: todos_reject_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,17}$
        required: true
      tags:
      - todos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentResponseRequest'
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/teams:
    get:
      operationId: teams_list
      description: List all workspace teams.
      tags:
      - Teams
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
          description: ''
  /api/teams/{id}:
    get:
      operationId: teams_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,17}$
        required: true
      tags:
      - Teams
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/teams/{id}/members:
    get:
      operationId: teams_members_retrieve
      description: List members of the authenticated user's team.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,17}$
        required: true
      tags:
      - teams
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/admin/users:
    get:
      operationId: admin_users_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: membership__team
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - member
        description: |-
          * `member` - Member
          * `admin` - Admin
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
