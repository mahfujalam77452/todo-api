        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - Notifications
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
