      operationId: admin_dashboard_overview_retrieve
      description: Database-backed workspace overview metrics for administrators.
      tags:
      - Admin Dashboard
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
          description: ''
  /api/admin/dashboard/users:
    get:
      operationId: admin_dashboard_users_list
      tags:
      - Admin Dashboard
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardUser'
          description: ''
  /api/admin/dashboard/teams:
    get:
      operationId: admin_dashboard_teams_list
      tags:
      - Admin Dashboard
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardTeam'
          description: ''
  /api/admin/dashboard/activity:
    get:
      operationId: admin_dashboard_activity_list
      tags:
      - Admin Dashboard
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
          description: ''
  /api/admin/users/{user_id}/todos:
    get:
      operationId: admin_users_todos_list
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Admin Dashboard
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/admin/todos/{todo_id}:
    get:
      operationId: admin_todos_retrieve
      parameters:
      - in: path
        name: todo_id
        schema:
          type: integer
        required: true
      tags:
      - Admin Dashboard
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
components:
  schemas:
    Activity:
      type: object
      properties:
        type:
          type: string
        todo_id:
          type: integer
        title:
          type: string
        user_id:
          type: integer
          nullable: true
        occurred_at:
          type: string
          format: date-time
        assignment_status:
          type: string
          nullable: true
      required:
      - assignment_status
      - occurred_at
      - title
      - todo_id
      - type
      - user_id
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          type: string
          maxLength: 20
        team:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        created_count:
          type: integer
          readOnly: true
          default: 0
        assigned_count:
          type: integer
          readOnly: true
          default: 0
      required:
      - assigned_count
      - created_count
      - email
      - id
      - name
      - team
    AssignTodoRequest:
      type: object
      properties:
        assignee_id:
          type: integer
      required:
      - assignee_id
    AssignmentResponseRequest:
      type: object
      properties:
        reason:
          type: string
          default: ''
          maxLength: 250
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
      required:
      - name
    DashboardTeam:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        member_count:
          type: integer
        todo_count:
          type: integer
        completed_count:
          type: integer
        pending_assignment_count:
          type: integer
        completion_rate:
          type: number
          format: double
      required:
      - completed_count
      - completion_rate
      - id
      - member_count
      - name
      - pending_assignment_count
      - todo_count
    DashboardUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        team:
          type: object
          additionalProperties: {}
          nullable: true
        created_count:
          type: integer
        assigned_count:
          type: integer
        completed_count:
          type: integer
        rejected_count:
          type: integer
        completion_rate:
          type: number
          format: double
        rejection_rate:
          type: number
          format: double
      required:
      - assigned_count
      - completed_count
      - completion_rate
      - created_count
      - email
      - id
      - name
      - rejected_count
      - rejection_rate
      - role
      - team
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: integer
      required:
      - code
      - error
    HealthResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    LoginRequest:
      type: object
      description: |-
        email + password in; access, refresh and the user out.

        A wrong email, a wrong password and a deactivated account all give the same
        401, so the answer does not reveal which addresses are registered.
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
      required:
      - refresh
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          readOnly: true
        message:
          type: string
          readOnly: true
        todo_id:
          type: integer
          readOnly: true
        link:
          type: string
          readOnly: true
        is_read:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - is_read
      - link
      - message
      - read_at
      - todo_id
      - type
    Overview:
      type: object
      properties:
        users:
          type: integer
        teams:
          type: integer
        todos:
          type: integer
        incomplete_todos:
          type: integer
        completed_todos:
          type: integer
        pending_assignments:
          type: integer
        completion_rate:
          type: number
          format: double
        bottlenecks:
          type: object
          additionalProperties: {}
      required:
      - bottlenecks
      - completed_todos
      - completion_rate
      - incomplete_todos
      - pending_assignments
      - teams
      - todos
      - users
    PaginatedAdminUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    PaginatedNotificationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    PaginatedTodoList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Todo'
    PatchedAdminUserRequest:
      type: object
      properties:
        role:
          type: string
          minLength: 1
          maxLength: 20
        team_id:
          type: integer
          writeOnly: true
          nullable: true
    PatchedCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
    PatchedTodoRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          default: ''
          maxLength: 10000
        status:
          type: string
          minLength: 1
          default: pending
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          default: 2
        due_date:
          type: string
          format: date-time
          nullable: true
        category:
          type: integer
          nullable: true
        assignee_id:
          type: integer
          writeOnly: true
          nullable: true
    PriorityEnum:
      enum:
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `1` - Low
        * `2` - Medium
        * `3` - High
    ReadAllResponse:
      type: object
      properties:
        updated:
          type: integer
      required:
      - updated
    Refresh:
      type: object
      description: |-
        simplejwt looks the user up with .get(): for a deleted user that raised
        DoesNotExist, which became a 500. A deleted user is simply not logged in.
      properties:
        refresh:
          type: string
        access:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    RefreshRequest:
      type: object
      description: |-
        simplejwt looks the user up with .get(): for a deleted user that raised
        DoesNotExist, which became a 500. A deleted user is simply not logged in.
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    Register:
      type: object
      description: |-
        name, email and password in; id, name and email out (never the password).

        Only these three fields exist, so a body with is_staff, is_superuser,
        is_active, id or date_joined cannot change anything: it is simply ignored.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        email:
          type: string
          maxLength: 254
      required:
      - email
      - id
      - name
    RegisterRequest:
      type: object
      description: |-
        name, email and password in; id, name and email out (never the password).

        Only these three fields exist, so a body with is_staff, is_superuser,
        is_active, id or date_joined cannot change anything: it is simply ignored.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - name
      - password
    Team:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    Todo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
          default: ''
          maxLength: 10000
        status:
          type: string
          default: pending
        is_completed:
          type: boolean
          readOnly: true
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          default: 2
        priority_display:
          type: string
          readOnly: true
        due_date:
          type: string
          format: date-time
          nullable: true
        category:
          type: integer
          nullable: true
        category_name:
          type: string
          readOnly: true
          nullable: true
        assigner:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        assignee:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        team:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        assignment_status:
          type: string
          readOnly: true
          nullable: true
        assigned_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        responded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_at
      - assignee
      - assigner
      - assignment_status
      - category_name
      - created_at
      - id
      - is_completed
      - priority_display
      - responded_at
      - team
      - title
      - updated_at
    TodoRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          default: ''
          maxLength: 10000
        status:
          type: string
          minLength: 1
          default: pending
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          default: 2
        due_date:
          type: string
          format: date-time
          nullable: true
        category:
          type: integer
          nullable: true
        assignee_id:
          type: integer
          writeOnly: true
          nullable: true
      required:
      - title
    TypeEnum:
      enum:
      - assigned
      - accepted
      - rejected
      - role_changed
      type: string
      description: |-
        * `assigned` - Assigned
        * `accepted` - Accepted
        * `rejected` - Rejected
        * `role_changed` - Role changed
    UnreadCount:
      type: object
      properties:
        count:
          type: integer
      required:
      - count
    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: integer
        details:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - code
      - details
      - error
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Authentication
  description: Register and manage JWT tokens.
- name: Todos
  description: Private todos owned by the authenticated user.
- name: Categories
  description: Global categories; writes require admin permissions.
- name: System
  description: Health and API documentation endpoints.
