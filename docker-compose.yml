services:
  web:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        format: raw
    environment:
      DEBUG: "false"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      REDIS_URL: redis://redis:6379/1
      DB_PATH: /data/db.sqlite3
      LOG_FILE: ""
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        format: raw
    environment:
      DEBUG: "false"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      REDIS_URL: ""
      DB_PATH: /tmp/test.sqlite3
      LOG_FILE: ""
      COLLECTSTATIC: "false"
    volumes:
      - .:/app:ro
    command: ["pytest", "-p", "no:cacheprovider", "tests/unit", "tests/integration"]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  sqlite_data:
  redis_data:
