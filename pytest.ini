[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
testpaths = tests
# Show every test name and outcome. Failures include a full traceback and the
# final summary lists all skipped, xfailed, and deselected tests.
addopts = --strict-markers -vv -ra --tb=long --show-capture=all
console_output_style = progress-even-when-capture-no
